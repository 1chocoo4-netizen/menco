<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>멘코 - 마음을 듣는 AI</title>
<style>
  :root {
    --bg: #1b1b24;
    --idle-1: #6c8cff;
    --idle-2: #8f6cff;
    --listen-1: #ff6c8c;
    --listen-2: #ff8f6c;
    --speak-1: #6cffb0;
    --speak-2: #6cd4ff;
    --text: #f2f2f7;
    --muted: #9a9ab0;
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
  }

  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 32px;
    background: radial-gradient(circle at 50% 40%, #23232f 0%, var(--bg) 70%);
    font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    color: var(--text);
    overflow: hidden;
  }

  .title {
    font-size: 22px;
    font-weight: 600;
    letter-spacing: 0.04em;
    color: var(--text);
    opacity: 0.9;
  }

  .affiliation {
    display: flex;
    flex-direction: row;
    align-items: center;
    gap: 16px;
    margin-bottom: -24px;
  }

  .affiliation-row {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .affiliation img {
    height: 17px;
    width: auto;
  }

  .affiliation span {
    font-size: 12px;
    color: var(--muted);
  }

  .status {
    min-height: 24px;
    font-size: 15px;
    color: var(--muted);
    text-align: center;
    max-width: 320px;
    line-height: 1.5;
  }

  .mic-wrap {
    position: relative;
    width: 220px;
    height: 220px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .ring {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--idle-1), var(--idle-2));
    opacity: 0.25;
    filter: blur(4px);
    transition: background 0.4s ease;
  }

  #micButton {
    --mic-level: 0;
    position: relative;
    width: 180px;
    height: 180px;
    border-radius: 50%;
    border: none;
    cursor: pointer;
    background: linear-gradient(135deg, var(--idle-1), var(--idle-2));
    box-shadow: 0 10px 40px rgba(108, 140, 255, 0.35);
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.4s ease, box-shadow 0.4s ease, transform 0.15s ease;
  }

  #micButton:active {
    transform: scale(0.97);
  }

  #micButton svg {
    width: 64px;
    height: 64px;
    fill: white;
  }

  /* listening state */
  body.listening .ring {
    background: linear-gradient(135deg, var(--listen-1), var(--listen-2));
    animation: pulse 1.4s ease-out infinite;
  }
  body.listening #micButton {
    background: linear-gradient(135deg, var(--listen-1), var(--listen-2));
    box-shadow: 0 10px 40px rgba(255, 108, 140, 0.45);
    transform: scale(calc(1 + var(--mic-level, 0) * 0.12));
    transition: transform 0.05s linear;
  }

  /* connecting state */
  body.connecting #micButton {
    background: linear-gradient(135deg, #666680, #444459);
    box-shadow: 0 10px 40px rgba(80, 80, 100, 0.35);
    animation: breathe 1.2s ease-in-out infinite;
  }

  /* speaking state */
  body.speaking .ring {
    background: linear-gradient(135deg, var(--speak-1), var(--speak-2));
    animation: pulse 1s ease-out infinite;
  }
  body.speaking #micButton {
    background: linear-gradient(135deg, var(--speak-1), var(--speak-2));
    box-shadow: 0 10px 40px rgba(108, 212, 255, 0.45);
  }

  @keyframes pulse {
    0% { transform: scale(1); opacity: 0.35; }
    70% { transform: scale(1.45); opacity: 0; }
    100% { transform: scale(1.45); opacity: 0; }
  }

  @keyframes breathe {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.6; }
  }

  .finish-btn {
    margin-top: -12px;
    padding: 10px 24px;
    border-radius: 999px;
    border: 1px solid rgba(242, 242, 247, 0.25);
    background: rgba(242, 242, 247, 0.08);
    color: var(--text);
    font-size: 14px;
    cursor: pointer;
    transition: background 0.2s ease;
  }
  .finish-btn:hover { background: rgba(242, 242, 247, 0.16); }
  .finish-btn[hidden] { display: none; }

  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(10, 10, 14, 0.72);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 10;
    animation: fadeIn 0.25s ease;
  }
  .modal-overlay[hidden] { display: none; }

  .modal-card {
    background: linear-gradient(160deg, #2a2a38, #201f29);
    border: 1px solid rgba(242, 242, 247, 0.1);
    border-radius: 20px;
    padding: 36px 32px;
    max-width: 320px;
    text-align: center;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
  }

  .modal-card.consent-card {
    max-width: 400px;
    width: 100%;
    text-align: left;
    max-height: 88vh;
    overflow-y: auto;
  }

  @media (max-width: 420px) {
    .modal-card { padding: 26px 20px; }
  }

  .modal-emoji { font-size: 40px; margin-bottom: 12px; }

  .modal-title {
    font-size: 18px;
    font-weight: 600;
    line-height: 1.5;
    margin-bottom: 24px;
  }

  .consent-card .modal-title { text-align: center; }

  .consent-list {
    list-style: none;
    margin: 0 0 28px;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 14px;
    font-size: 14px;
    line-height: 1.6;
    color: var(--text);
  }

  .consent-card .modal-close-btn { display: block; margin: 0 auto; }

  .modal-close-btn:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }

  .consent-form {
    display: flex;
    flex-direction: column;
    gap: 18px;
    margin-bottom: 26px;
  }

  .form-row {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .form-label {
    font-size: 13px;
    font-weight: 600;
    color: var(--muted);
  }

  .gender-options {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }

  .pill-option {
    position: relative;
    display: inline-flex;
  }

  .pill-option input {
    position: absolute;
    inset: 0;
    opacity: 0;
    margin: 0;
    cursor: pointer;
  }

  .pill-option span {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-height: 40px;
    padding: 9px 18px;
    border-radius: 999px;
    border: 1px solid rgba(242, 242, 247, 0.25);
    background: rgba(242, 242, 247, 0.06);
    font-size: 14px;
    color: var(--text);
    white-space: nowrap;
    transition: background 0.2s ease, border-color 0.2s ease, color 0.2s ease;
  }

  .pill-option input:checked + span {
    background: linear-gradient(135deg, var(--speak-1), var(--speak-2));
    border-color: transparent;
    color: #10151a;
    font-weight: 600;
  }

  .pill-option input:focus-visible + span {
    outline: 2px solid var(--speak-2);
    outline-offset: 2px;
  }

  .age-input {
    width: 100%;
    padding: 12px 14px;
    border-radius: 12px;
    border: 1px solid rgba(242, 242, 247, 0.25);
    background: rgba(242, 242, 247, 0.06);
    color: var(--text);
    font-size: 16px;
    font-family: inherit;
    outline: none;
  }

  .age-input:focus {
    border-color: var(--speak-2);
  }

  .age-input::placeholder {
    color: var(--muted);
  }

  .modal-close-btn {
    padding: 10px 28px;
    border-radius: 999px;
    border: none;
    background: linear-gradient(135deg, var(--speak-1), var(--speak-2));
    color: #10151a;
    font-weight: 600;
    font-size: 14px;
    cursor: pointer;
  }

  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }
</style>
</head>
<body>
  <div class="affiliation">
    <div class="affiliation-row">
      <img src="soongsil-logo.png" alt="숭실대학교 로고" />
      <span>숭실대학교 부설</span>
    </div>
    <div class="affiliation-row">
      <img src="kcrilc-icon.png" alt="한국커리어·학습코칭연구소 로고" />
      <span class="kcrilc-text">한국커리어·학습코칭연구소</span>
    </div>
  </div>
  <div class="title">MENCO</div>

  <div class="mic-wrap">
    <div class="ring"></div>
    <button id="micButton" aria-label="마이크 버튼">
      <svg viewBox="0 0 24 24"><path d="M12 14a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v5a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2z"/></svg>
    </button>
  </div>

  <div class="status" id="status">버튼을 누르고 멘탈 코칭 대화를 시작해 보세요</div>

  <button id="finishButton" class="finish-btn" hidden>코칭 완료</button>

  <div id="consentModal" class="modal-overlay">
    <div class="modal-card consent-card">
      <div class="modal-title">멘탈코치 멘코 이용 안내</div>
      <ul class="consent-list">
        <li>🔒 대화 내용은 익명화되어 연구·분석 목적으로만 저장되며, 연구자 외에는 누구도 볼 수 없습니다.</li>
        <li>📊 질문과 답변은 익명화된 멘탈 역량 분석 및 교육·연구에 활용될 수 있습니다.</li>
        <li>🤝 멘코의 모든 코칭은 코칭 윤리와 개인정보 보호 원칙을 따릅니다.</li>
      </ul>

      <div class="consent-form">
        <div class="form-row">
          <label class="form-label">성별</label>
          <div class="gender-options" role="radiogroup" aria-label="성별">
            <label class="pill-option">
              <input type="radio" name="gender" value="female" />
              <span>여성</span>
            </label>
            <label class="pill-option">
              <input type="radio" name="gender" value="male" />
              <span>남성</span>
            </label>
            <label class="pill-option">
              <input type="radio" name="gender" value="unspecified" />
              <span>응답 안 함</span>
            </label>
          </div>
        </div>
        <div class="form-row">
          <label class="form-label" for="ageInput">나이</label>
          <input
            type="text"
            id="ageInput"
            class="age-input"
            inputmode="numeric"
            pattern="[0-9]*"
            autocomplete="off"
            placeholder="예: 28"
            maxlength="3"
          />
        </div>
      </div>

      <button id="consentAgreeButton" class="modal-close-btn" disabled>동의합니다</button>
    </div>
  </div>

  <div id="completionModal" class="modal-overlay" hidden>
    <div class="modal-card">
      <div class="modal-emoji">🎉</div>
      <div class="modal-title">오늘의 한걸음을<br />응원합니다!!</div>
      <button id="modalCloseButton" class="modal-close-btn">확인</button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
