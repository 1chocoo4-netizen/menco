services:
  - type: web
    name: mencoo-mvp
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_LIVE_MODEL
        value: gemini-2.5-flash-native-audio-latest
      - key: ADMIN_API_URL
        sync: false
      - key: INTERNAL_API_TOKEN
        sync: false

  - type: web
    name: mencoo-admin
    runtime: node
    plan: starter
    rootDir: admin
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_ANALYSIS_MODEL
        value: gemini-2.5-flash
      - key: INTERNAL_API_TOKEN
        sync: false
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: DATA_DIR
        value: /var/data
    disk:
      name: mencoo-admin-data
      mountPath: /var/data
      sizeGB: 1
